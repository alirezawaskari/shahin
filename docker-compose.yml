
    services:
      app:
       build:
          context: .
          dockerfile: Dockerfile
       container_name: lalecart_app
       volumes:
          -  ./:/var/www
          - ./php.ini:/usr/local/etc/php/conf.d/uploads.ini
       working_dir: /var/www
       depends_on:
          - db
       networks:
          - lalecart

      nginx:
        image: nginx:alpine
        container_name: lalecart_nginx
        ports:
          - "8001:80"
        volumes:
          - ./:/var/www
          - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
        depends_on:
          - app
        networks:
          - lalecart

      db:
        image: mysql:8
        command: --max_allowed_packet=256M --wait_timeout=600 --interactive_timeout=600
        container_name: shahin_db
        restart: always
        environment:
          MYSQL_DATABASE: lale_db
          MYSQL_ROOT_PASSWORD: root
          MYSQL_USER: lalecart
          MYSQL_PASSWORD: secret
        ports:
          - "3308:3306"
        volumes:
          - dbdata:/var/lib/mysql
        networks:
          - lalecart


      phpmyadmin:
          image: phpmyadmin/phpmyadmin
          container_name: phpmyadminlalecart
          restart: always
          ports:
              - "8082:80"
          environment:
              PMA_HOST: db
              PMA_PORT: 3306
              UPLOAD_LIMIT: 100M
          depends_on:
              - db
          networks:
              - lalecart
    volumes:
      dbdata:

    networks:
      lalecart:
